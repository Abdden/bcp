version: 2.1
orbs:
  coveralls: coveralls/coveralls@1.0.6
jobs:
  build:
    working_directory: ~/bcp
    docker:
      - image: cimg/node:18.12.1
    environment:
      DATABASE_URI: process.env.MONGODB_URI
    steps:
      # CircleCI's default `checkout` uses an SSH deploy key. Build 68 failed
      # with `Permission denied (publickey)` before npm install. This public
      # repo can be cloned over HTTPS without project SSH settings.
      - run:
          name: Checkout via HTTPS
          command: |
            set -euo pipefail
            git init
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git fetch --force origin "${CIRCLE_SHA1}"
            git reset --hard FETCH_HEAD
            git checkout -B "${CIRCLE_BRANCH}"
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install dependencies
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: run tests
          command: npm run test
      - coveralls/upload
      - store_artifacts:
          path: ~/bcp/artifacts
notify:
  webhooks:
    - url: https://coveralls.io/webhook?repo_token=${process.env.COVERALLS_REPO_TOKEN}
